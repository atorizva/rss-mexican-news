# Mexican news sources. Each entry has a `type` of either "feed" or "scrape":
#
#   type = "feed"    -> `url` points at an RSS/Atom feed
#   type = "scrape"  -> `url` points at a homepage; CSS selectors describe the items
#
# Example feed source:
#
# [[sources]]
# type = "feed"
# name = "Example"
# homepage = "https://example.com"
# url = "https://example.com/feed.xml"
#
# Example scrape source (selectors are relative to each `item` element):
#
# [[sources]]
# type = "scrape"
# name = "Example"
# homepage = "https://example.com"
# url = "https://example.com"
# item = "article.news"
# title = "h2"
# link = "h2 a"
# summary = "p"
# published = "time"

[[sources]]
type = "scrape"
name = "Proceso"
homepage = "https://www.proceso.com.mx"
url = "https://www.proceso.com.mx/"
item = "a.news-article"
title = ".news-article__title"
summary = ".news-article__excerpt"

[[sources]]
type = "scrape"
name = "El Universal"
homepage = "https://www.eluniversal.com.mx"
url = "https://www.eluniversal.com.mx/"
item = "a.event-cards"
title = "h2"
summary = '[class$="__subtitle"]'

[[sources]]
type = "feed"
name = "Excélsior"
homepage = "https://www.excelsior.com.mx"
url = "https://www.excelsior.com.mx/rss"

[[sources]]
type = "scrape"
name = "Animal Político"
homepage = "https://grupoanimal.mx"
url = "https://grupoanimal.mx/noticias"
item = "#ssr-list li"
title = "a"
published = "span"
